[project]
name = "terrashield-backend"
version = "1.0.0"
description = "TerraShield DecisionOps AI backend: API, worker, simulator and planner (simulation POC)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "pgvector",
    "argon2-cffi",
    "ortools",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pip-audit",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "S311", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: requires a PostgreSQL test database (TS_TEST_DATABASE_URL)",
    "ollama: requires a running Ollama with the configured models",
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]
